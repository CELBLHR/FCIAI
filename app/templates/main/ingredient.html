
{% extends "main/base_layout.html" %}

{% block title %}保健食品成分搜索{% endblock %}

{% block styles %}
<style>
/* 重写容器样式 */
.container {
    margin-left: 17vw !important;
    width: 83vw !important;
    background-color: #f8f9fa;
    color: rgb(110,111,114);
    line-height: 1.6;
    padding: 1.4vw;
    min-height: 100vh;
    box-sizing: border-box;
}

/* 页面标题样式 */
.page-title {
    color: rgb(0,148,217);
    margin-bottom: 2.1vw;
    font-size: 2rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.7vw;
}

/* 搜索容器样式 */
.ingredient-container {
    color: rgb(110,111,114);
    background: white;
    border-radius: 0.8vw;
    padding: 2.1vw;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* 搜索输入框样式 */
.search-input {
    color: rgb(110,111,114);
    background: white;
    border: 1px solid #dee2e6;
    border-radius: 0.5vw;
    padding: 0.8vw 1.2vw;
    font-size: 1rem;
    transition: all 0.2s ease;
}

.search-input:focus {
    outline: none;
    border-color: rgb(0,148,217);
    box-shadow: 0 0 0 3px rgba(0,148,217,0.1);
}

.search-input::placeholder {
    color: rgba(110,111,114,0.6);
}

.search-btn {
    background-color: rgb(0,148,217);
    color: white;
    border: none;
    border-radius: 0.5vw;
    padding: 0.8vw 2.1vw;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.5vw;
}

.search-btn:hover {
    background-color: rgb(0,130,190);
}

/* 搜索结果样式 */
.search-results {
    color: rgb(110,111,114);
    background: #f8f9fa;
    border-radius: 0.6vw;
    padding: 1.8vw;
    border: 1px solid #e9ecef;
    margin-top: 1.4vw;
}

/* 搜索容器布局 */
.search-container {
    display: flex;
    gap: 1.2vw;
    align-items: center;
}

.search-container input {
    flex: 1;
}

/* 响应式设计 */
@media (max-width: 768px) {
    .search-container {
        flex-direction: column;
        gap: 1vw;
    }
    
    .search-btn {
        align-self: flex-start;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="ingredient-container">
    <h1 class="page-title">
        <i class="bi bi-search"></i>
        保健食品成分搜索
    </h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="请输入要查询的成分名称...">
        <button type="button" class="search-btn" onclick="searchIngredient()">
            <i class="bi bi-search"></i> 查询
        </button>
    </div>

    <div id="searchResults" class="search-results">
        <!-- 搜索结果将在这里动态显示 -->
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/ingredient.js') }}"></script>
{% endblock %}
